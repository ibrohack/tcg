<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Checkout | Chaos and Monkeys</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "tertiary-fixed-dim": "#40d8f2",
              "on-primary-fixed-variant": "#544600",
              "on-background": "#e9e2d1",
              "on-secondary-fixed-variant": "#53460a",
              "on-secondary-fixed": "#221b00",
              "surface-variant": "#383529",
              "primary": "#f4d125",
              "on-error-container": "#ffdad6",
              "on-error": "#690005",
              "surface-bright": "#221f10",
              "surface": "#161309",
              "tertiary-fixed": "#a2eeff",
              "surface-container-lowest": "#0b0a04",
              "surface-dim": "#110f08",
              "on-primary-fixed": "#221b00",
              "surface-container-highest": "#383529",
              "error": "#ffb4ab",
              "primary-fixed": "#ffe165",
              "on-tertiary-fixed-variant": "#004e5a",
              "tertiary-container": "#7e22ce",
              "secondary": "#3b82f6",
              "on-secondary-container": "#dbeafe",
              "primary-container": "#443a00",
              "outline-variant": "#322f20",
              "on-primary-container": "#f4d125",
              "on-primary": "#221f10",
              "surface-container-high": "#2d2a1f",
              "surface-container-low": "#1e1b11",
              "surface-container": "#231f15",
              "secondary-fixed-dim": "#d9c67e",
              "on-secondary": "#ffffff",
              "inverse-surface": "#e9e2d1",
              "outline": "#4c4733",
              "on-tertiary-fixed": "#001f25",
              "tertiary": "#a855f7",
              "on-tertiary": "#ffffff",
              "on-surface": "#e9e2d1",
              "secondary-fixed": "#f6e298",
              "secondary-container": "#1d4ed8",
              "on-surface-variant": "#cfc6ac",
              "error-container": "#93000a",
              "inverse-primary": "#6f5d00",
              "inverse-on-surface": "#343025",
              "background": "#221f10",
              "primary-fixed-dim": "#e7c511",
              "on-tertiary-container": "#f3e8ff",
              "surface-tint": "#f4d125"
            },
            fontFamily: {
              "headline": ["Space Grotesk"],
              "body": ["Space Grotesk"],
              "label": ["Space Grotesk"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .circuit-bg {
        background-image: radial-gradient(circle at 2px 2px, rgba(244, 209, 37, 0.05) 1px, transparent 0);
        background-size: 24px 24px;
      }
      .glass-panel {
        background: rgba(34, 31, 16, 0.8);
        backdrop-filter: blur(12px);
      }
    </style>
</head>

<body class="bg-background text-on-background font-body selection:bg-primary selection:text-on-primary min-h-screen flex flex-col">

  <!-- TopAppBar -->
  <header th:replace="~{fragments/layout :: navbar('confirmPurchase')}"></header>

  <!-- Main Content -->
  <main class="flex-grow pt-24 pb-12 px-6 circuit-bg relative overflow-hidden">

    <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8 relative z-10">

      <!-- Payment Form -->
      <div class="lg:col-span-7 space-y-6">

        <section class="p-8 rounded-xl bg-surface-container-low border border-primary/10 shadow-xl shadow-primary/5">

          <h2 class="text-xl font-bold uppercase mb-6 flex items-center gap-2">
            <span class="material-symbols-outlined text-primary">credit_card</span>
            Payment Method
          </h2>

          <form class="space-y-6">

            <div>
              <label class="text-[10px] uppercase font-bold text-on-surface-variant">
                Cardholder Name
              </label>
              <input type="text"
                class="w-full bg-surface-container-highest p-4 rounded-lg"
                placeholder="COMMANDER MONKEY" />
            </div>

            <div>
              <label class="text-[10px] uppercase font-bold text-on-surface-variant">
                Card Number
              </label>
              <input type="text"
                class="w-full bg-surface-container-highest p-4 rounded-lg"
                placeholder="0000 0000 0000 0000" />
            </div>
			<div class="grid grid-cols-2 gap-4">
				<div class="space-y-2">
					<label class="text-[10px] font-bold uppercase tracking-wider text-on-surface-variant">Expiry Date</label>
					<input class="w-full bg-surface-container-highest border-none focus:ring-2 focus:ring-primary text-on-surface font-mono placeholder:text-outline p-4 rounded-lg text-center" placeholder="MM / YY" type="text"/>
				</div>
				<div class="space-y-2">
					<label class="text-[10px] font-bold uppercase tracking-wider text-on-surface-variant">CVV</label>
					<input class="w-full bg-surface-container-highest border-none focus:ring-2 focus:ring-primary text-on-surface font-mono placeholder:text-outline p-4 rounded-lg text-center" placeholder="***" type="password"/>
				</div>
			</div>
          </form>

        </section>

      </div>

      <!-- Summary -->
      <div class="lg:col-span-5">

        <aside class="sticky top-24 space-y-4">

          <div class="p-8 rounded-xl bg-surface-container border-2 border-primary/40">

            <h2 class="text-xs font-black uppercase tracking-widest text-primary mb-6">
              Manifest Summary
            </h2>

            <div class="flex justify-between text-sm mb-2">
              <span>Subtotal</span>
              <span>$99.00</span>
            </div>

            <div class="flex justify-between text-sm mb-2">
              <span>Fuel Tax (8%)</span>
              <span>$7.92</span>
            </div>

            <div class="flex justify-between text-sm mb-6">
              <span>Processing Fee</span>
              <span class="text-primary">WAIVED</span>
            </div>

            <div class="flex justify-between items-end mb-6">
              <div>
                <p class="text-xs uppercase">Total Commitment</p>
                <p class="text-4xl font-black text-primary">$106.92</p>
              </div>
            </div>

            <button class="w-full bg-primary py-5 rounded-lg font-bold uppercase">
              Authorize Transaction
            </button>

          </div>

        </aside>

      </div>

    </div>

  </main>

  <!-- Footer -->
  <footer class="border-t border-[#f4d125]/20 bg-[#221f10] px-8 py-12 flex flex-col md:flex-row justify-between items-center gap-6">

    <div class="text-[#f4d125] font-bold">
      CHAOS AND MONKEYS
    </div>

    <div class="text-[10px] uppercase text-gray-500">
      © 2024 CHAOS AND MONKEYS. BUILT ON APEIRON GOLD.
    </div>

    <div class="flex gap-6 text-[10px] uppercase text-gray-500">
      <a href="#">Terms of War</a>
      <a href="#">Privacy Protocol</a>
      <a href="#">Discord</a>
    </div>

  </footer>

</body>
</html>
