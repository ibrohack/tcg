<!DOCTYPE html>
<html class="dark" lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Chaos and Monkeys - Player Dashboard')}">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased">
    <div
        class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark overflow-x-hidden">
        <div class="layout-container flex h-full grow flex-col">

            <!-- Navbar -->
            <header th:replace="~{fragments/layout :: navbar('dashboard')}"></header>

            <main class="flex-1 max-w-[1200px] mx-auto w-full px-6 py-8">
                <!-- Profile Section -->
                <section class="mb-12">
                    <div
                        class="bg-white dark:bg-primary/5 rounded-xl p-6 border border-slate-200 dark:border-primary/10 flex flex-col md:flex-row md:items-center justify-between gap-6">
                        <div class="flex items-center gap-6">
                            <div class="relative">
                                <div
                                    class="size-24 rounded-full bg-primary/30 flex items-center justify-center border-4 border-primary overflow-hidden shadow-lg shadow-primary/20">
                                    <img th:if="${player.avatarUrl != null}"
                                        th:src="@{${player.avatarUrl}(v=${#dates.createNow().time})}" alt="Avatar"
                                        class="h-full w-full object-cover">
                                    <span th:unless="${player.avatarUrl != null}"
                                        class="material-symbols-outlined text-primary text-4xl">person</span>
                                </div>
                            </div>
                            <div th:with="size=${player.cards.size()}">
                                <h1 class="text-3xl font-bold text-slate-900 dark:text-slate-100"><a
                                        th:href="@{/profile/edit}" th:text="${player.username}"></a></h1>
                                <p class="text-slate-500 dark:text-slate-400 font-medium" th:if="${size == 0}">Noob
                                    Monkey
                                </p>
                                <p class="text-slate-500 dark:text-slate-400 font-medium"
                                    th:if="${size > 0 and size <= 10}">Noob Monkey
                                </p>
                                <p class="text-slate-500 dark:text-slate-400 font-medium"
                                    th:if="${size > 10 and size <= 50}">
                                    Veteran Monkey
                                </p>
                                <p class="text-slate-500 dark:text-slate-400 font-medium"
                                    th:if="${size > 50 and size <= 100}">
                                    Primate Lord
                                </p>
                                <p class="text-slate-500 dark:text-slate-400 font-medium" th:if="${size > 100}">
                                    Primate King
                                </p>
                            </div>
                        </div>
                        <div class="flex gap-4">
                            <a th:href="@{/cards}"
                                class="bg-primary hover:bg-primary/80 text-background-dark font-bold px-8 py-3 rounded-lg transition-all flex items-center gap-2 self-stretch">
                                <span class="material-symbols-outlined">collections_bookmark</span>
                                VIEW COLLECTION
                            </a>
                        </div>
                    </div>
                </section>
                <!-- Decks & Stats Grid -->
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-12">
                    <!-- My Decks Section -->
                    <div class="lg:col-span-2">
                        <div class="flex items-center justify-between mb-6">
                            <h2 class="text-2xl font-bold flex items-center gap-2">
                                <span class="material-symbols-outlined text-primary">style</span>
                                My Decks
                            </h2>
                            <a th:href="@{/deckcheck}" class="text-primary font-bold text-sm hover:underline">View
                                Decks</a>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                            <!-- Add New Deck -->
                            <a th:href="@{/deckcreate}"
                                class="group flex flex-col items-center justify-center rounded-xl border-2 border-dashed border-slate-300 dark:border-primary/20 bg-transparent p-3 hover:border-primary transition-all cursor-pointer min-h-[200px]">
                                <div
                                    class="material-symbols-outlined text-4xl text-slate-400 dark:text-primary/40 group-hover:text-primary mb-2">
                                    add_circle</div>
                                <div class="text-slate-500 dark:text-primary/60 font-bold group-hover:text-primary">
                                    New
                                    Deck</div>
                            </a>
                            <div th:each="deck : ${decks}"
                                class="group flex flex-col items-center justify-center rounded-xl border-2 border-dashed border-slate-300 dark:border-primary/20 bg-transparent p-3 hover:border-primary transition-all cursor-pointer min-h-[200px]">
                                <a th:text="${deck.title}" th:href="@{/deckview(deckId=${deck.deckID})}"
                                    class="text-slate-500 dark:text-primary/60 font-bold group-hover:text-primary">
                                </a>
                            </div>
                        </div>
                    </div>
                    <!-- Stats / Quick Nav -->
                    <div class="space-y-4">
                        <a th:href="@{/shop#daily-reward}"
                            class="bg-primary text-background-dark rounded-xl p-5 flex items-center justify-between group cursor-pointer">
                            <div>
                                <p class="font-bold text-lg leading-tight">Claim Daily Reward</p>
                                <p class="text-sm font-medium opacity-80">Available now!</p>
                            </div>
                            <span
                                class="material-symbols-outlined text-4xl group-hover:scale-110 transition-transform">redeem</span>
                        </a>
                    </div>
                </div>
                <!-- Player Cards Section -->
                <section th:if="${player.cards != null and !player.cards.isEmpty()}">
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-2xl font-bold flex items-center gap-2">
                            <span class="material-symbols-outlined text-primary">cards</span>
                            Your Cards
                        </h2>
                    </div>
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
                        <div th:each="entry : ${player.cards}"
                            class="group bg-white dark:bg-background-dark rounded-xl border border-primary/20 overflow-hidden transition-all hover:-translate-y-2">
                            <div class="relative aspect-[2/3] bg-primary/5">
                                <img th:src="@{'/images/cards/' + ${entry.key} + '.png'}"
                                    th:alt="'Card #' + ${entry.key}" class="w-full h-full object-cover" />
                                <div
                                    class="absolute bottom-0 inset-x-0 p-3 bg-gradient-to-t from-background-dark to-transparent">
                                    <div class="flex justify-between items-end">
                                        <span class="text-primary font-bold" th:text="'#' + ${entry.key}">#0</span>
                                        <span class="text-xs font-bold text-slate-300"
                                            th:text="'x' + ${entry.value}">x0</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            </main>

            <!-- Footer -->
            <footer th:replace="~{fragments/layout :: footer}"></footer>
        </div>
    </div>
</body>

</html>
