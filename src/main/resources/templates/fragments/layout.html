<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<!-- ==================== HEAD FRAGMENT ==================== -->
<head th:fragment="head(pageTitle)">
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title th:text="${pageTitle}">Chaos and Monkeys</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f4d125",
                        "background-light": "#f8f8f5",
                        "background-dark": "#221f10",
                        "card-common": "#94a3b8",
                        "card-rare": "#3b82f6",
                        "card-epic": "#a855f7",
                        "card-legendary": "#f97316",
                        "card-mythic": "#ef4444",
                        "card-arok": "#2dd4bf",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
</head>

<!-- ==================== NAVBAR FRAGMENT ==================== -->
<!--/*
    Parameters:
      - currentPage: String identifying the active page ('dashboard', 'collection', 'shop', 'login', 'register')
      - player:      the Player object from session (can be null if not logged in)
*/-->
<header th:fragment="navbar(currentPage)"
    class="flex items-center justify-between whitespace-nowrap border-b border-solid border-slate-200 dark:border-primary/20 px-6 lg:px-20 py-4 bg-background-light dark:bg-background-dark sticky top-0 z-50">
    <!-- Logo -->
    <div class="flex items-center gap-4">
        <div class="size-8 text-primary">
            <svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 4H17.3334V17.3334H30.6666V30.6666H44V44H4V4Z" fill="currentColor"></path>
            </svg>
        </div>
        <h2 class="text-slate-900 dark:text-slate-100 text-xl font-bold leading-tight tracking-[-0.015em]">
            Chaos and Monkeys</h2>
    </div>

    <div class="flex flex-1 justify-end gap-4 lg:gap-8 items-center">
        <!-- Navigation Links -->
        <nav class="hidden md:flex gap-6">
            <!-- Always visible: Collection (cards gallery) -->
            <a th:href="@{/cards}"
                th:classappend="${currentPage == 'collection'} ? 'text-primary font-bold' : 'text-slate-600 dark:text-slate-400 hover:text-primary transition-colors font-medium'"
                class="text-sm"
                href="#">Collection</a>

            <!-- Logged-in only links -->
            <th:block th:if="${session.loggedPlayer != null}">
                <a th:href="@{/player}"
                    th:classappend="${currentPage == 'dashboard'} ? 'text-primary font-bold' : 'text-slate-600 dark:text-slate-400 hover:text-primary transition-colors font-medium'"
                    class="text-sm"
                    href="#">Dashboard</a>
                <a th:href="@{/shop}"
                    th:classappend="${currentPage == 'shop'} ? 'text-primary font-bold' : 'text-slate-600 dark:text-slate-400 hover:text-primary transition-colors font-medium'"
                    class="text-sm"
                    href="#">Shop</a>
            </th:block>
        </nav>

        <!-- Right side: Logged-in player info OR Login/Register buttons -->
        <th:block th:if="${session.loggedPlayer != null}">
            <!-- Logged-in: show notifications, settings, avatar, logout -->
            <div class="flex gap-2">
                <button
                    class="flex items-center justify-center rounded-lg h-10 w-10 bg-slate-100 dark:bg-primary/10 text-slate-900 dark:text-primary transition-colors hover:bg-primary/20">
                    <span class="material-symbols-outlined">notifications</span>
                </button>
            </div>
            <div class="flex items-center gap-3">
                <div class="h-10 w-10 rounded-full bg-primary/20 border-2 border-primary overflow-hidden flex items-center justify-center">
                    <span class="material-symbols-outlined text-primary">person</span>
                </div>
                <span class="text-sm font-bold text-slate-100 hidden lg:inline"
                    th:text="${session.loggedPlayer.username}">Player</span>
            </div>
            <a th:href="@{/logout}"
                class="flex items-center gap-2 bg-primary/10 border border-primary/30 text-primary px-4 py-2 rounded-lg font-bold text-sm hover:bg-primary hover:text-background-dark transition-all">
                <span class="material-symbols-outlined text-lg">logout</span>
                Logout
            </a>
        </th:block>

        <th:block th:if="${session.loggedPlayer == null}">
            <!-- Not logged-in: show Login and Register buttons -->
            <a th:href="@{/login}"
                class="flex items-center gap-2 bg-primary/10 border border-primary/30 text-primary px-4 py-2 rounded-lg font-bold text-sm hover:bg-primary hover:text-background-dark transition-all">
                <span class="material-symbols-outlined text-lg">login</span>
                Login
            </a>
            <a th:href="@{/register}"
                class="flex items-center gap-2 bg-primary text-background-dark px-4 py-2 rounded-lg font-bold text-sm hover:brightness-110 transition-all">
                <span class="material-symbols-outlined text-lg">person_add</span>
                Register
            </a>
        </th:block>
    </div>
</header>

<!-- ==================== FOOTER FRAGMENT ==================== -->
<footer th:fragment="footer"
    class="border-t border-slate-200 dark:border-primary/10 py-8 px-6 lg:px-20 mt-12 bg-slate-50 dark:bg-background-dark/50">
    <div class="max-w-[1200px] mx-auto flex flex-col md:flex-row justify-between items-center gap-6 text-slate-500 dark:text-slate-400 text-sm">
        <div class="flex items-center gap-2">
            <div class="size-5 text-primary opacity-50">
                <svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 4H17.3334V17.3334H30.6666V30.6666H44V44H4V4Z" fill="currentColor"></path>
                </svg>
            </div>
            <span>© 2024 Chaos and Monkeys TCG. All rights reserved.</span>
        </div>
        <div class="flex gap-8 font-medium">
            <a class="hover:text-primary transition-colors" href="#">Privacy Policy</a>
            <a class="hover:text-primary transition-colors" href="#">Terms of Service</a>
            <a class="hover:text-primary transition-colors" href="#">Support</a>
        </div>
    </div>
</footer>

</html>
