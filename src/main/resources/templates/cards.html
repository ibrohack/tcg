<!DOCTYPE html>
<html class="dark" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f4d125",
                        "background-light": "#f8f8f5",
                        "background-dark": "#221f10",
                        "card-common": "#94a3b8",
                        "card-rare": "#3b82f6",
                        "card-epic": "#a855f7",
                        "card-legendary": "#f97316",
                        "card-mythic": "#ef4444",
                        "card-arok": "#2dd4bf",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
    <title>Chaos and Monkeys - Card Gallery</title>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
<div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden">
    <div class="layout-container flex h-full grow flex-col">
        <!-- TopNavBar -->
        <header class="flex items-center justify-between border-b border-white/10 px-6 py-4 lg:px-20 bg-background-dark/50 backdrop-blur-md sticky top-0 z-50">
            <div class="flex items-center gap-4">
                <div class="size-8 text-primary">
                    <svg fill="currentColor" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 4H17.3334V17.3334H30.6666V30.6666H44V44H4V4Z"></path>
                    </svg>
                </div>
                <h2 class="text-xl font-bold leading-tight tracking-tight uppercase">Chaos and Monkeys</h2>
            </div>
            <nav class="hidden md:flex items-center gap-10">
                <a class="text-slate-400 hover:text-primary transition-colors text-sm font-medium uppercase tracking-wider" href="#">Dashboard</a>
                <a class="text-primary border-b-2 border-primary pb-1 text-sm font-medium uppercase tracking-wider" href="#">Collection</a>
                <a class="text-slate-400 hover:text-primary transition-colors text-sm font-medium uppercase tracking-wider" href="#">Shop</a>
            </nav>
            <div class="flex items-center gap-3">
                <div class="flex items-center gap-2 bg-primary text-background-dark px-4 py-1.5 rounded-lg font-bold text-sm">
                    <span class="material-symbols-outlined text-lg">payments</span>
                    <span>1,250</span>
                </div>
                <div class="size-10 rounded-full border-2 border-primary/30 overflow-hidden bg-white/5 flex items-center justify-center">
                    <span class="material-symbols-outlined">person</span>
                </div>
            </div>
        </header>
        <main class="flex-1 px-6 lg:px-20 py-8">
            <!-- Search and Hero Section -->
            <div class="mb-10 text-center max-w-3xl mx-auto">
                <h1 class="text-4xl font-bold mb-6">Card Gallery</h1>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <span class="material-symbols-outlined text-slate-400 group-focus-within:text-primary transition-colors">search</span>
                    </div>
                    <input class="w-full bg-white/5 border border-white/10 rounded-xl py-4 pl-12 pr-4 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all placeholder:text-slate-500 text-lg" placeholder="Search cards by name, ability, or type..." type="text"/>
                </div>
            </div>
            <!-- Filters -->
            <div class="flex flex-wrap items-center justify-center gap-3 mb-10">
                <button class="px-6 py-2 rounded-full bg-primary text-background-dark font-bold text-sm uppercase tracking-wide transition-all shadow-lg shadow-primary/20">All</button>
                <button class="px-6 py-2 rounded-full bg-white/5 border border-white/10 hover:border-card-common/50 text-slate-300 font-medium text-sm uppercase tracking-wide transition-all">Common</button>
                <button class="px-6 py-2 rounded-full bg-white/5 border border-white/10 hover:border-card-rare/50 text-slate-300 font-medium text-sm uppercase tracking-wide transition-all">Rare</button>
                <button class="px-6 py-2 rounded-full bg-white/5 border border-white/10 hover:border-card-epic/50 text-slate-300 font-medium text-sm uppercase tracking-wide transition-all">Epic</button>
                <button class="px-6 py-2 rounded-full bg-white/5 border border-white/10 hover:border-card-legendary/50 text-slate-300 font-medium text-sm uppercase tracking-wide transition-all">Legendary</button>
                <button class="px-6 py-2 rounded-full bg-white/5 border border-white/10 hover:border-card-mythic/50 text-slate-300 font-medium text-sm uppercase tracking-wide transition-all">Mythic</button>
                <button class="px-6 py-2 rounded-full bg-white/5 border border-white/10 hover:border-card-arok/50 text-slate-300 font-medium text-sm uppercase tracking-wide transition-all">Arok</button>
            </div>
            <!-- Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-8">
                <!-- Dynamic Card Template -->
                <div th:each="card : ${cards}"
                     class="group relative flex flex-col bg-slate-900/40 rounded-xl transition-all duration-300 overflow-hidden shadow-xl hover:-translate-y-2"
                     th:classappend="${card.quality.equalsIgnoreCase('Common')} ? 'border border-card-common/20 hover:border-card-common' :
                                     (${card.quality.equalsIgnoreCase('Rare')} ? 'border border-card-rare/20 hover:border-card-rare hover:shadow-card-rare/20' :
                                     (${card.quality.equalsIgnoreCase('Epic')} ? 'border border-card-epic/20 hover:border-card-epic hover:shadow-card-epic/20' :
                                     (${card.quality.equalsIgnoreCase('Legendary')} ? 'border border-card-legendary/20 hover:border-card-legendary hover:shadow-card-legendary/30' :
                                     (${card.quality.equalsIgnoreCase('Mythic')} ? 'border border-card-mythic/20 hover:border-card-mythic hover:shadow-card-mythic/40' :
                                     (${card.quality.equalsIgnoreCase('Arok')} ? 'border border-card-arok/20 hover:border-card-arok hover:shadow-card-arok/50' :
                                     'border border-white/20')))))">
                    <div class="aspect-[3/4] relative overflow-hidden">
                        <div class="absolute inset-0 bg-gradient-to-t from-background-dark via-transparent to-transparent z-10"></div>
                        <!-- Rarity badge -->
                        <div class="absolute top-3 left-3 z-20 backdrop-blur-md px-2 py-1 rounded text-[10px] font-bold uppercase tracking-tighter"
                             th:classappend="${card.quality.equalsIgnoreCase('Common')} ? 'bg-card-common/20 border border-card-common/50' :
                                             (${card.quality.equalsIgnoreCase('Rare')} ? 'bg-card-rare/20 border border-card-rare/50' :
                                             (${card.quality.equalsIgnoreCase('Epic')} ? 'bg-card-epic/20 border border-card-epic/50' :
                                             (${card.quality.equalsIgnoreCase('Legendary')} ? 'bg-card-legendary/20 border border-card-legendary/50' :
                                             (${card.quality.equalsIgnoreCase('Mythic')} ? 'bg-card-mythic/20 border border-card-mythic/50 text-card-mythic' :
                                             (${card.quality.equalsIgnoreCase('Arok')} ? 'bg-card-arok/20 border border-card-arok/50 text-card-arok' :
                                             'bg-white/20 border border-white/50')))))"
                             th:text="${card.quality}">Quality</div>
                    </div>
                    <div class="p-5 flex flex-col gap-2 relative z-20">
                        <h3 class="text-xl font-bold text-slate-100" th:text="${card.name}">Card Name</h3>
                        <p class="text-sm text-slate-400 leading-relaxed" th:text="${card.description}">Card description goes here.</p>
                        <div class="mt-4 flex justify-between items-center">
                            <span class="text-xs font-bold text-slate-500 uppercase" th:text="${card.quality}">Type</span>
                            <div class="flex gap-2 text-primary font-bold">
                                <span class="material-symbols-outlined text-sm">bolt</span>
                                <span th:text="${card.cardID}">0</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Empty state when no cards -->
            <div th:if="${#lists.isEmpty(cards)}" class="text-center py-20">
                <span class="material-symbols-outlined text-6xl text-slate-600">style</span>
                <p class="text-slate-500 text-lg mt-4">No cards found in the collection.</p>
            </div>
        </main>
        <!-- Footer -->
        <footer class="border-t border-white/10 px-6 lg:px-20 py-8 bg-background-dark/80 mt-12">
            <div class="flex flex-col md:flex-row justify-between items-center gap-6">
                <div class="flex items-center gap-3">
                    <div class="size-6 text-primary/60">
                        <svg fill="currentColor" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                            <path d="M4 4H17.3334V17.3334H30.6666V30.6666H44V44H4V4Z"></path>
                        </svg>
                    </div>
                    <span class="text-slate-500 text-sm font-bold uppercase tracking-widest">© 2024 Chaos and Monkeys TCG</span>
                </div>
                <div class="flex gap-8 text-slate-500 text-xs font-bold uppercase tracking-tighter">
                    <a class="hover:text-primary transition-colors" href="#">Terms of Battle</a>
                    <a class="hover:text-primary transition-colors" href="#">Privacy Jungle</a>
                    <a class="hover:text-primary transition-colors" href="#">Support</a>
                </div>
            </div>
        </footer>
    </div>
</div>
</body>
</html>
