<!DOCTYPE html>
<html class="dark" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Chaos and Monkeys - Packs')}">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body class="bg-background text-on-background font-body selection:bg-primary selection:text-on-primary min-h-screen flex flex-col">

  <header th:replace="~{fragments/layout :: navbar('confirmPurchase')}"></header>

  <main class="flex-grow pt-24 pb-12 px-6 circuit-bg relative overflow-hidden">
    <form th:action="@{/confirmPurchase}" method="post" class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8 relative z-10">
      
      <input type="hidden" name="coins" th:value="${coins}">
      <input type="hidden" name="action" value="pay">

      <div class="lg:col-span-7 space-y-6">
        <section class="p-8 rounded-xl bg-surface-container-low border border-primary/10 shadow-xl shadow-primary/5">
          <h2 class="text-xl font-bold uppercase mb-6 flex items-center gap-2">
            <span class="material-symbols-outlined text-primary">credit_card</span>
            Payment Method
          </h2>
          
          <div class="space-y-6">
            <div>
              <label class="text-[10px] uppercase font-bold text-on-surface-variant">Cardholder Name</label>
              <input type="text" 
                name="cardName"
                required
                class="w-full bg-surface-container-highest p-4 rounded-lg focus:ring-2 focus:ring-primary outline-none"
                placeholder="COMMANDER MONKEY" />
            </div>

            <div>
              <label class="text-[10px] uppercase font-bold text-on-surface-variant">Card Number</label>
              <input type="text" required pattern="(?:\d{4} ?){4}" class="w-full bg-surface-container-highest p-4 rounded-lg focus:ring-2 focus:ring-primary outline-none"
			  placeholder="0000 0000 0000 0000" />
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div class="space-y-2">
                <label class="text-[10px] font-bold uppercase tracking-wider text-on-surface-variant">Expiry Date</label>
                <input type="text" required pattern="(0[1-9]|1[0-2])\/?([0-9]{2})"class="w-full bg-surface-container-highest border-none focus:ring-2 focus:ring-primary text-on-surface font-mono placeholder:text-outline p-4 rounded-lg text-center" 
                  placeholder="MM / YY" />
              </div>

              <div class="space-y-2">
                <label class="text-[10px] font-bold uppercase tracking-wider text-on-surface-variant">CVV</label>
                <input type="password" required pattern="^[0-9]{3}$"class="w-full bg-surface-container-highest border-none focus:ring-2 focus:ring-primary text-on-surface font-mono placeholder:text-outline p-4 rounded-lg text-center" 
                  placeholder="***" />
              </div>
            </div>
          </div>
        </section>
      </div>

      <div class="lg:col-span-5">
        <div class="sticky top-24 space-y-4">
          <div class="p-8 rounded-xl bg-surface-container border-2 border-primary/40">
            <h2 class="text-xs font-black uppercase tracking-widest text-primary mb-6">
              Manifest Summary
            </h2>
            <div class="flex justify-between text-sm mb-2">
              <span>Subtotal</span>
              <span th:text="${price} + '€'"></span>
            </div>
            <div class="flex justify-between text-sm mb-2">
              <span>Fuel Tax (8%)</span>
              <span th:text="${#numbers.formatDecimal(price * 0.08, 1, 2)} + '€'"></span>
            </div>
            <div class="flex justify-between items-end mb-6">
              <div>
                <p class="text-xs uppercase">Total Commitment</p>
                <p th:text="${#numbers.formatDecimal(price + (price * 0.08), 1, 2)} + '€'" class="text-4xl font-black text-primary"></p>
              </div>
            </div>

            <button type="submit" class="w-full bg-primary py-5 rounded-lg font-bold uppercase hover:bg-primary/90 transition-colors">
              Authorize Transaction
            </button>
          </div>
        </div>
      </div>
    </form>
  </main>

  <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
