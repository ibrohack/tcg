<!DOCTYPE html>

<html class="dark" lang="en">

<head th:replace="~{fragments/layout :: head('Chaos and Monkeys - ' + ${player.username})}"></head>

<body class="bg-background text-on-background font-body min-h-screen selection:bg-primary selection:text-on-primary">
    <!-- TopNavBar -->
    <header th:replace="~{fragments/layout :: navbar('deckview')}"></header>
    <div class="flex min-h-[calc(100vh-72px)]">
        <!-- Main Content -->
        <main class="flex-1 p-6 md:p-10 max-w-[1600px] mx-auto w-full">
            <!-- Header Area -->
            <section class="mb-12">
                <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-8">
                    <div>
                        <span class="font-label text-xs uppercase tracking-[0.2em] text-primary mb-2 block"
                            th:text="${player.username} + '\'s Deck'"> </span>
                        <h1
                            class="font-headline text-5xl md:text-6xl font-black text-on-background tracking-tighter italic">
                            Deck: <span class="text-primary" th:text="${deck.title}"></span>
                        </h1>
                    </div>
                </div>
            </section>
            <!-- Card Grid Section -->
            <section>
                <div class="flex justify-between items-center mb-6">
                    <h2 class="font-headline text-2xl font-bold uppercase tracking-tight">Deck Contents</h2>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-5 gap-6">
                    <!-- Cards (Repeated for effect) -->
                    <div th:each="card : ${cards}"
                        class="group relative bg-surface-container-lowest border border-purple-500/30 overflow-hidden transition-all shadow-l rounded-lg"
                        th:classappend="${card.quality.equalsIgnoreCase('Common')} ? 'border border-card-common/20 hover:border-card-common' :
                                     (${card.quality.equalsIgnoreCase('Rare')} ? 'border border-card-rare/20 hover:border-card-rare hover:shadow-card-rare/20' :
                                     (${card.quality.equalsIgnoreCase('Epic')} ? 'border border-card-epic/20 hover:border-card-epic hover:shadow-card-epic/20' :
                                     (${card.quality.equalsIgnoreCase('Legendary')} ? 'border border-card-legendary/20 hover:border-card-legendary hover:shadow-card-legendary/30' :
                                     (${card.quality.equalsIgnoreCase('Mythic')} ? 'border border-card-mythic/20 hover:border-card-mythic hover:shadow-card-mythic/40' :
                                     (${card.quality.equalsIgnoreCase('Arok')} ? 'border border-card-arok/20 hover:border-card-arok hover:shadow-card-arok/50' :
                                     'border border-white/20')))))">
                        <div class="aspect-[3/4] relative overflow-hidden">
                            <img th:alt="${card.cardID}"
                                class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-all"
                                data-alt="mystical creature with swirling purple energy and electric sparks in a rain-soaked futuristic forest"
                                th:src="@{'/images/cards/' + ${card.cardID} + '.png'}" />
                            <div
                                class="absolute inset-0 bg-gradient-to-t from-surface-container-lowest via-transparent to-transparent">
                            </div>
                        </div>
                        <div class="absolute top-3 left-3 z-20 backdrop-blur-md px-2 py-1 rounded text-[10px] font-bold uppercase tracking-tighter"
                            th:classappend="${card.quality.equalsIgnoreCase('Common')} ? 'bg-card-common/20 border border-card-common/50' :
                                             (${card.quality.equalsIgnoreCase('Rare')} ? 'bg-card-rare/20 border border-card-rare/50' :
                                             (${card.quality.equalsIgnoreCase('Epic')} ? 'bg-card-epic/20 border border-card-epic/50' :
                                             (${card.quality.equalsIgnoreCase('Legendary')} ? 'bg-card-legendary/20 border border-card-legendary/50' :
                                             (${card.quality.equalsIgnoreCase('Mythic')} ? 'bg-card-mythic/20 border border-card-mythic/50 text-card-mythic' :
                                             (${card.quality.equalsIgnoreCase('Arok')} ? 'bg-card-arok/20 border border-card-arok/50 text-card-arok' :
                                             'bg-white/20 border border-white/50')))))" th:text="${card.quality}">
                        </div>
                        <div class="p-4">
                            <h3 class="font-headline text-xl font-bold uppercase leading-tight" th:classappend="${card.quality.equalsIgnoreCase('Common')} ? 'text-card-common' :
                                             (${card.quality.equalsIgnoreCase('Rare')} ? 'text-card-rare' :
                                             (${card.quality.equalsIgnoreCase('Epic')} ? 'text-card-epic' :
                                             (${card.quality.equalsIgnoreCase('Legendary')} ? 'text-card-legendary' :
                                             (${card.quality.equalsIgnoreCase('Mythic')} ? 'text-card-mythic' :
                                             (${card.quality.equalsIgnoreCase('Arok')} ? 'text-card-arok' :
                                             'bg-white/20 border border-white/50')))))" th:text="${card.name}"></h3>
                            </h3>
                            <span class="text-s font-black italic font-headline" th:classappend="${card.quality.equalsIgnoreCase('Common')} ? 'text-card-common' :
                                             (${card.quality.equalsIgnoreCase('Rare')} ? 'text-card-rare' :
                                             (${card.quality.equalsIgnoreCase('Epic')} ? 'text-card-epic' :
                                             (${card.quality.equalsIgnoreCase('Legendary')} ? 'text-card-legendary' :
                                             (${card.quality.equalsIgnoreCase('Mythic')} ? 'text-card-mythic' :
                                             (${card.quality.equalsIgnoreCase('Arok')} ? 'text-card-arok' :
                                             'bg-white/20 border border-white/50')))))"
                                th:text="${card.quality}"></span>
                            <div class="mt-4 flex justify-between items-center">
                                <span class="text-xs font-black italic font-headline" th:classappend="${card.quality.equalsIgnoreCase('Common')} ? 'text-card-common' :
                                             (${card.quality.equalsIgnoreCase('Rare')} ? 'text-card-rare' :
                                             (${card.quality.equalsIgnoreCase('Epic')} ? 'text-card-epic' :
                                             (${card.quality.equalsIgnoreCase('Legendary')} ? 'text-card-legendary' :
                                             (${card.quality.equalsIgnoreCase('Mythic')} ? 'text-card-mythic' :
                                             (${card.quality.equalsIgnoreCase('Arok')} ? 'text-card-arok' :
                                             'bg-white/20 border border-white/50')))))"
                                    th:text="${card.description}"></span>
                                <div class="flex gap-2 text-primary font-bold">
                                    <span class="material-symbols-outlined text-sm">stack_group</span>
                                    <span th:text="${cardQuantities.get(card.cardID)}"></span>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <footer th:replace=" ~{fragments/layout :: footer}">
    </footer>
</body>

</html>
