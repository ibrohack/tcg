<!DOCTYPE html>
<html class="dark" lang="en" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/layout :: head('Chaos and Monkeys - Card Gallery')}">
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>

    <body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
        <div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">

            <!-- Navbar -->
            <header th:replace="~{fragments/layout :: navbar('pack')}"></header>

            <main class="flex-1 px-6 lg:px-20 py-8">

                <div class="flex items-center gap-4">
                    <div class="text-primary size-8">
                        <svg fill="currentColor" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                            <path d="M4 4H17.3334V17.3334H30.6666V30.6666H44V44H4V4Z"></path>
                        </svg>
                    </div>
                    <h2 class="text-xl font-bold tracking-tight">Chaos and Monkeys</h2>
                </div>

                <div class="flex items-center gap-6">
                    <nav class="hidden md:flex gap-6 items-center">
                        <a class="flex items-center gap-2 text-primary font-medium" href="#">
                            <span class="material-symbols-outlined">storefront</span> Shop
                        </a>
                        <a class="flex items-center gap-2 hover:text-primary transition-colors" href="#">
                            <span class="material-symbols-outlined">style</span> Collection
                        </a>
                    </nav>

                    <div class="flex items-center gap-3">
                        <div class="flex items-center bg-primary/10 border border-primary/30 rounded-lg px-3 py-1.5 gap-2">
                            <span class="material-symbols-outlined text-primary text-xl">monetization_on</span>
                            <span class="font-bold text-primary">12,450</span>
                        </div>

                        <div class="size-10 rounded-full border-2 border-primary bg-cover bg-center"
                             data-alt="User profile avatar monkey character"
                             style="background-image: url('https://lh3.googleusercontent.com/...')">
                        </div>
                    </div>
                </div>

            </main>

            <main class="flex-1 flex flex-col items-center justify-center px-4 py-8 lg:py-12 max-w-7xl mx-auto w-full">

                <div class="w-full text-center mb-10">
                    <h1 class="text-4xl md:text-5xl font-bold mb-2 text-slate-900 dark:text-slate-50">
                        Jungle Spirit Pack
                    </h1>
                    <p class="text-slate-600 dark:text-slate-400">
                        Contains cards of Common to Arok quality!
                    </p>
                </div>

                <!-- Pack -->
                <div class="relative w-full max-w-2xl aspect-[4/3] flex items-center justify-center mb-16">
                    <div class="absolute inset-0 bg-primary/20 blur-[100px] rounded-full scale-75 opacity-50"></div>

                    <div class="relative group cursor-pointer transition-transform duration-500 hover:scale-105">
                        <div class="absolute -inset-4 bg-gradient-to-t from-primary/40 to-transparent blur-xl rounded-xl opacity-75 group-hover:opacity-100"></div>

                        <div class="relative w-64 h-80 bg-background-dark border-4 border-primary rounded-2xl overflow-hidden shadow-2xl flex flex-col items-center justify-center gap-4">
                            <div class="absolute inset-0 opacity-20 pointer-events-none bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-primary via-transparent to-transparent"></div>

                            <div class="w-40 h-40 bg-primary/20 rounded-full flex items-center justify-center">
                                <span class="material-symbols-outlined text-primary text-8xl">pets</span>
                            </div>

                            <div class="text-center px-4">
                                <h3 class="text-primary font-bold text-2xl uppercase tracking-widest">
                                    Chaos Pack
                                </h3>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Botón -->
                <div class="flex flex-col items-center gap-6 mb-16">
                    <button class="group relative px-12 py-5 bg-primary rounded-xl font-bold text-background-dark text-xl flex items-center gap-3">
                        <span class="material-symbols-outlined">auto_fix_high</span>
                        OPEN PACK
                    </button>
                </div>

                <!-- Cards -->
                <div class="w-full grid grid-cols-2 md:grid-cols-6 gap-4 lg:gap-6 px-4">

                    <!-- Ejemplo Card -->
                    <div class="aspect-[2/3] rounded-xl border-2 border-slate-700/50 bg-slate-800/30 flex flex-col items-center justify-center">
                        <span class="material-symbols-outlined text-common text-5xl mb-4">question_mark</span>
                        <span class="text-[10px] text-common font-bold uppercase">Common</span>
                    </div>

                    <!-- Mythic -->
                    <div class="aspect-[2/3] rounded-xl border-2 border-mythic bg-background-dark flex flex-col items-center justify-between p-3">
                        <div class="w-full h-1/2 rounded-lg overflow-hidden bg-mythic/10 flex items-center justify-center">
                            <span class="material-symbols-outlined text-mythic text-6xl">skull</span>
                        </div>
                        <div class="text-center mt-2">
                            <span class="text-[9px] text-mythic font-black uppercase">Mythic</span>
                            <h4 class="text-sm font-bold">BLOODFANG BERSERKER</h4>
                        </div>
                    </div>

                </div>

            </main>
        </div>
    </body>
</html>
