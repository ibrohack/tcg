<!DOCTYPE html>

<html th:with="loadDeckBuilding=true" class="dark" lang="en">

<head th:replace="~{fragments/layout :: head('Chaos and Monkeys - Deck Creation')}"></head>

<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display min-h-screen">
    <div class="relative flex h-screen w-full flex-col overflow-hidden">
        <!-- Top Navigation Bar -->
        <header th:replace="~{fragments/layout :: navbar('deckcreate')}"></header>
        <main class="flex flex-1 overflow-hidden">
            <!-- Left Side: Card Collection -->
            <div class="flex-1 flex flex-col border-r border-primary/10 bg-slate-50 dark:bg-background-dark/50">
                <!-- Filters Area -->
                <div class="p-4 border-b border-primary/10 flex flex-wrap gap-3">
                    <button
                        class="flex items-center gap-2 px-4 py-1.5 rounded-full bg-primary text-background-dark font-medium text-sm">
                        <span class="material-symbols-outlined text-sm">all_inclusive</span> All
                    </button>
                    <button
                        class="flex items-center gap-2 px-4 py-1.5 rounded-full bg-slate-200 dark:bg-primary/20 text-slate-700 dark:text-primary font-medium text-sm hover:bg-primary/30 transition-colors">
                        <span class="material-symbols-outlined text-sm">diamond</span> Arok
                    </button>
                    <button
                        class="flex items-center gap-2 px-4 py-1.5 rounded-full bg-slate-200 dark:bg-primary/20 text-slate-700 dark:text-primary font-medium text-sm hover:bg-primary/30 transition-colors">
                        <span class="material-symbols-outlined text-sm">auto_awesome</span> Mythic
                    </button>
                    <button
                        class="flex items-center gap-2 px-4 py-1.5 rounded-full bg-slate-200 dark:bg-primary/20 text-slate-700 dark:text-primary font-medium text-sm hover:bg-primary/30 transition-colors">
                        <span class="material-symbols-outlined text-sm">star</span> Legendary
                    </button>
                    <div class="ml-auto flex items-center gap-2">
                        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Sort by:</span>
                        <select
                            class="bg-transparent border-none text-sm font-bold text-primary focus:ring-0 cursor-pointer">
                            <option>Quality (High-Low)</option>
                            <option>Cost (Low-High)</option>
                            <option>Name</option>
                        </select>
                    </div>
                </div>
                <!-- Grid Scrollable -->
                <div
                    class="flex-1 overflow-y-auto p-6 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">
                    <!-- Card Items -->
                    <div th:each="card : ${cards}" class="flex flex-col gap-2 group cursor-pointer"
                        th:onclick="'addCardToDeck(' + ${card.cardID} + ')'" th:id="'card-' + ${card.cardID}">
                        <div class="relative aspect-[3/4] rounded-lg overflow-hidden border-2 border-transparent group-hover:border-quality-mythic transition-all bg-slate-800 shadow-xl"
                            th:classappend="${card.quality.equalsIgnoreCase('Common')} ? 'border border-card-common/20 hover:border-card-common' :
                                     (${card.quality.equalsIgnoreCase('Rare')} ? 'border border-card-rare/20 hover:border-card-rare hover:shadow-card-rare/20' :
                                     (${card.quality.equalsIgnoreCase('Epic')} ? 'border border-card-epic/20 hover:border-card-epic hover:shadow-card-epic/20' :
                                     (${card.quality.equalsIgnoreCase('Legendary')} ? 'border border-card-legendary/20 hover:border-card-legendary hover:shadow-card-legendary/30' :
                                     (${card.quality.equalsIgnoreCase('Mythic')} ? 'border border-card-mythic/20 hover:border-card-mythic hover:shadow-card-mythic/40' :
                                     (${card.quality.equalsIgnoreCase('Arok')} ? 'border border-card-arok/20 hover:border-card-arok hover:shadow-card-arok/50' :
                                     'border border-white/20')))))" th:data-alt="${card.quality}">
                            <img th:src="@{'/images/cards/' + ${card.cardID} + '.png'}" th:alt="${card.name}"
                                class="absolute inset-0 w-full h-full object-cover transition-transform duration-300 group-hover:scale-110" />
                            <div class="absolute top-2 right-2 size-8 rounded-full bg-quality-mythic flex items-center justify-center font-bold text-white shadow-md card-quantity-display"
                                th:text="${player.cards.get(card.cardID)}"></div>
                            <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent">
                            </div>
                            <div class="absolute bottom-3 left-3 right-3 text-white">
                                <p class="text-[10px] font-bold uppercase tracking-widest text-quality-mythic"
                                    th:text="${card.quality}"></p>
                                <p class="text-sm font-bold leading-tight mb-1 card-name-display" th:classappend=" ${card.quality.equalsIgnoreCase('Common')} ? 'text-common' :
                                    (${card.quality.equalsIgnoreCase('Rare')} ? 'text-rare' :
                                    (${card.quality.equalsIgnoreCase('Epic')} ? 'text-epic' :
                                    (${card.quality.equalsIgnoreCase('Legendary')} ? 'text-legendary' :
                                    (${card.quality.equalsIgnoreCase('Mythic')} ? 'text-mythic' :
                                    (${card.quality.equalsIgnoreCase('Arok')} ? 'text-arok' : 'text-white' )))))"
                                    th:text="${card.name}"></p>
                                <p class="text-[10px] text-slate-300 leading-tight line-clamp-2"
                                    th:text="${card.description}"></p>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
            <!-- Right Side: Current Deck -->
            <aside class="w-80 md:w-96 bg-background-light dark:bg-background-dark flex flex-col">
                <div class="p-6 border-b border-primary/10" id="deck-header">
                    <div class="flex items-center justify-between mb-2">
                        <h2 class="text-xl text-yellow-500 font-bold ">Current Deck</h2>
                        <span class="bg-primary/20 text-primary px-2 py-1 rounded text-sm font-bold" id="deck-quantity"
                            th:text="${deckQuantity + '/30'}"></span>
                    </div>

                </div>
                <!-- Card List -->
                <div class="flex-1 overflow-y-auto" id="deck-sidebar">
                    <div class="divide-y divide-primary/5">
                        <!--CARD DIV-->
                        <template id="card-template">
                            <div class="p-4 hover:bg-primary/5 flex items-center gap-3 transition-colors item-card-div">
                                <div
                                    class="size-10 bg-quality-mythic/20 rounded-lg flex items-center justify-center font-bold text-quality-mythic card-id-display">
                                </div>
                                <div class="flex-1">
                                    <h4 class="text-sm font-bold card-name-display"></h4>
                                    <p
                                        class="text-[10px] uppercase text-quality-mythic font-bold card-quality-display card-cost-display">
                                    </p>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="text-xs font-bold text-slate-400 card-quantity-display"></span>
                                    <button type="button"
                                        class="size-6 rounded bg-slate-200 dark:bg-slate-700 flex items-center justify-center hover:bg-primary/50 remove-btn">
                                        <span class="material-symbols-outlined text-sm">remove</span>
                                    </button>
                                </div>
                                <input type="hidden" class="hidden-card-id" value="">
                            </div>
                        </template>
                        <!--END CARD DIV-->

                    </div>
                </div>

                <div class="p-4 bg-slate-100 dark:bg-background-dark border-t border-primary/20 flex flex-col gap-2">
                    <form th:action="@{/deckcreate}" method="post" id="deck-form">
                        <input type="hidden" name="deckID" th:value="${deck.deckID}">
                        <h2 class="text-yellow-500 font-bold ">Deck Title</h2>
                        <input name="title"
                            class="w-60 bg-background-dark border border-primary/20 focus:border-primary focus:ring-1 focus:ring-primary/20 text-slate-100 pl-12 pr-4 py-4 rounded-lg transition-all font-mono text-sm placeholder:text-slate-600 my-2"
                            placeholder="Deck Title" type="text" required />
                        <h2 class="text-yellow-500 font-bold ">Deck Description</h2>
                        <input name="description"
                            class="w-full bg-background-dark border border-primary/20 focus:border-primary focus:ring-1 focus:ring-primary/20 text-slate-100 pl-12 pr-4 py-4 rounded-lg transition-all font-mono text-sm placeholder:text-slate-600 my-2"
                            placeholder="Deck Description" type="text" required />
                        <div id="hidden-cards-container"></div>
                        <button
                            class="flex items-center gap-2 bg-primary text-background-dark px-6 py-2 rounded-lg font-bold hover:bg-primary/90 hover:text-background-dark hover:border-primary/50 hover:shadow-primary/20 transition-all my-1">
                            <span class="material-symbols-outlined">save</span>
                            <span>Save Deck</span>
                        </button>
                    </form>
                    <form th:action="@{/deckclear}" method="post">
                        <input type="hidden" name="deckID" th:value="${deck.deckID}">
                        <button
                            class="flex items-center gap-2 bg-primary text-background-dark px-6 py-2 rounded-lg font-bold hover:bg-red-500 hover:text-background-dark hover:border-red-500/50 hover:shadow-red-500/20 transition-all my-1">
                            <span class="material-symbols-outlined">delete</span>
                            <span>Clear All Cards</span>
                        </button>
                    </form>
                    <div th:if="${error}"
                        class="mb-6 p-4 bg-red-500/10 border border-red-500/30 rounded-lg text-red-400 text-sm font-medium text-center">
                        <span class="material-symbols-outlined text-sm align-middle mr-1">error</span>
                        <span th:text="${error}"></span>
                    </div>
                    <div th:if="${success}"
                        class="mb-6 p-4 bg-green-500/10 border border-green-500/30 rounded-lg text-green-400 text-sm font-medium text-center">
                        <span class="material-symbols-outlined text-sm align-middle mr-1">check_circle</span>
                        <span th:text="${success}"></span>
                    </div>
                </div>
            </aside>
        </main>
    </div>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>

</html>
