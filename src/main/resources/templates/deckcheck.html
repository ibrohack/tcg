<!DOCTYPE html>

<html class="dark" lang="en">

<head th:replace="~{fragments/layout :: head('Chaos and Monkeys - ' + ${player.username})}"></head>

<body class="font-body text-on-background selection:bg-primary selection:text-on-primary min-h-screen">
    <header th:replace="~{fragments/layout :: navbar('decks')}"></header>
    <main class="max-w-screen-2xl mx-auto px-6 pt-24 pb-12">
        <div class="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-12">
            <div>
                <p class="text-[#f4d125] font-bold uppercase tracking-[0.2em] text-[10px] mb-2">Strategy Hub</p>
                <h1
                    class="font-headline text-5xl md:text-6xl font-black text-on-background tracking-tighter leading-none">
                    MY DECKS</h1>
            </div>
            <div class="flex items-center gap-3 bg-surface-container-high px-4 py-3 border-l-4 border-primary">
                <span class="material-symbols-outlined text-primary">info</span>
                <span class="text-sm font-medium" th:text="${decks.size() + ' active decks ready for battle.'}"></span>
            </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-4 lg:grid-cols-6 gap-6">
            <button
                class="md:col-span-2 lg:col-span-2 flex flex-col items-center justify-center p-8 bg-primary/5 border-2 border-dashed border-primary/30 rounded-xl hover:bg-primary/10 hover:border-primary transition-all group aspect-square">
                <div
                    class="h-20 w-20 rounded-full bg-primary flex items-center justify-center mb-6 group-hover:scale-110 transition-transform shadow-lg shadow-primary/20">
                    <span class="material-symbols-outlined text-background text-4xl font-bold">add</span>
                </div>
                <h3 class="font-headline text-2xl font-bold text-primary uppercase tracking-tight">Create New Deck</h3>
                <p class="text-on-surface-variant text-sm mt-2 text-center">Forge a new path to primal dominance</p>
            </button>
            <div class="md:col-span-2 lg:col-span-2 relative group overflow-hidden bg-surface-container rounded-xl border border-primary/10 hover:border-primary/50 transition-all aspect-square"
                th:each="deck : ${decks}">
                <div class="absolute inset-0 bg-gradient-to-t from-background via-background/40 to-transparent z-10">
                </div>
                <img class="absolute inset-0 w-full h-full object-cover grayscale-[20%] group-hover:scale-105 group-hover:grayscale-0 transition-all duration-700"
                    data-alt="Lush jungle environment with glowing flora"
                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuC6N7hwRQCB6icf3hz25CEpqrYhA7SchY2ATbY6MLMY-Ncmk7siUQ45IBoTiQh6qiCPb7_Tdxiz-XHxprLDQnmSg3Lg3MXBJrN4bUkDxlVyO2IL_VTylgFFCBM60QDCY-cH6jAgA1BS5XAM8oMXjvGDda-u5RUAqK5SZvqIMNHsJ6txXuFLwLy6u2LI4p_yinVENLxzSMJyornwWJBGksOUOrfZ_izJnduICcQqfysS-ydRpXcT-k6-iu01grWS0pqbxH3DbZ5ww9T3" />
                <div class="absolute bottom-0 left-0 right-0 p-6 z-20">
                    <div class="flex justify-between items-end">
                        <div>
                            <h2 class="font-headline text-3xl font-black text-on-background tracking-tight uppercase"
                                th:text="${deck.title}"></h2>
                            <div class="flex items-center gap-2 text-primary mt-1">
                                <span class="material-symbols-outlined text-sm">style</span>
                                <span class="text-xs font-bold tracking-widest uppercase"
                                    th:text="${deck.cards.size()} + ' Cards'"></span>
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <button
                                class="h-10 w-10 bg-primary/10 backdrop-blur-md border border-primary/30 flex items-center justify-center text-primary hover:bg-primary hover:text-background transition-colors rounded">
                                <span class="material-symbols-outlined">edit</span>
                            </button>
                            <button
                                class="h-10 w-10 bg-error/10 backdrop-blur-md border border-error/30 flex items-center justify-center text-error hover:bg-error hover:text-on-error transition-colors rounded">
                                <span class="material-symbols-outlined">delete</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>

</html>
