<!DOCTYPE html>
<html class="dark" lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Chaos and Monkeys - Edit Profile')}">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased">
    <div
        class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark overflow-x-hidden">
        <div class="layout-container flex h-full grow flex-col">

            <!-- Navbar -->
            <header th:replace="~{fragments/layout :: navbar('dashboard')}"></header>

            <main class="flex-1 max-w-[800px] mx-auto w-full px-6 py-8">
                <!-- Notifications -->
                <div th:if="${success}" class="mb-6 p-4 bg-green-100 border border-green-400 text-green-700 rounded-lg">
                    <span th:text="${success}"></span>
                </div>
                <div th:if="${error}" class="mb-6 p-4 bg-red-100 border border-red-400 text-red-700 rounded-lg">
                    <span th:text="${error}"></span>
                </div>

                <div class="bg-white dark:bg-primary/5 rounded-xl border border-slate-200 dark:border-primary/10 overflow-hidden">
                    <div class="p-6 border-b border-slate-200 dark:border-primary/10">
                        <h2 class="text-2xl font-bold">Edit Profile</h2>
                        <p class="text-slate-500 dark:text-slate-400 text-sm mt-1">Update your password and profile picture.</p>
                    </div>

                    <form th:action="@{/profile/edit}" method="post" enctype="multipart/form-data" class="p-6 space-y-8">
                        
                        <!-- Profile Picture Section -->
                        <div class="flex flex-col sm:flex-row gap-6 items-start sm:items-center">
                            <div class="size-24 rounded-full bg-primary/30 flex items-center justify-center border-4 border-primary overflow-hidden shadow-lg shadow-primary/20 shrink-0">
                                <img th:if="${player.avatarUrl != null}" th:src="${player.avatarUrl}" alt="Current Avatar" class="h-full w-full object-cover">
                                <span th:unless="${player.avatarUrl != null}" class="material-symbols-outlined text-primary text-4xl">person</span>
                            </div>
                            <div class="flex-1">
                                <label class="block text-sm font-bold mb-2">Profile Picture</label>
                                <input type="file" name="profilePicture" accept="image/png, image/jpeg, image/gif, image/webp" 
                                    class="block w-full text-sm text-slate-500 dark:text-slate-400
                                    file:mr-4 file:py-2 file:px-4
                                    file:rounded-full file:border-0
                                    file:text-sm file:font-semibold
                                    file:bg-primary/10 file:text-primary
                                    hover:file:bg-primary/20
                                    transition-all cursor-pointer"/>
                                <p class="text-xs text-slate-500 dark:text-slate-400 mt-2">JPEG, PNG, WEBP or GIF.</p>
                            </div>
                        </div>

                        <hr class="border-slate-200 dark:border-primary/10">

                        <!-- Password Section -->
                        <div>
                            <h3 class="text-lg font-bold mb-4">Change Password</h3>
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-sm font-bold mb-1">Current Password</label>
                                    <input type="password" name="oldPassword" class="w-full bg-slate-100 dark:bg-background-dark border border-slate-200 dark:border-primary/20 rounded-lg px-4 py-2 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all">
                                </div>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-sm font-bold mb-1">New Password</label>
                                        <input type="password" name="newPassword" class="w-full bg-slate-100 dark:bg-background-dark border border-slate-200 dark:border-primary/20 rounded-lg px-4 py-2 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-bold mb-1">Confirm New Password</label>
                                        <input type="password" name="confirmPassword" class="w-full bg-slate-100 dark:bg-background-dark border border-slate-200 dark:border-primary/20 rounded-lg px-4 py-2 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all">
                                    </div>
                                </div>
                            </div>
                            <p class="text-xs text-slate-500 dark:text-slate-400 mt-3">Leave password fields blank if you only want to update your profile picture.</p>
                        </div>

                        <div class="flex justify-end pt-4">
                            <button type="submit" class="bg-primary hover:bg-primary/80 text-background-dark font-bold px-8 py-3 rounded-lg transition-all">
                                Save Changes
                            </button>
                        </div>
                    </form>
                </div>
            </main>

            <!-- Footer -->
            <footer th:replace="~{fragments/layout :: footer}"></footer>
        </div>
    </div>
</body>

</html>
