<!DOCTYPE html>
<html th:with="loadPasswordScript=true, loadImageCrop=true" class="dark" lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Chaos and Monkeys - Edit Profile')}">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased">
    <div
        class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark overflow-x-hidden">
        <div class="layout-container flex h-full grow flex-col">

            <!-- Navbar -->
            <header th:replace="~{fragments/layout :: navbar('dashboard')}"></header>

            <main class="flex-1 max-w-[800px] mx-auto w-full px-6 py-8">
                <!-- Notifications -->
                <div th:if="${success}" class="mb-6 p-4 bg-green-100 border border-green-400 text-green-700 rounded-lg">
                    <span th:text="${success}"></span>
                </div>
                <div th:if="${error}" class="mb-6 p-4 bg-red-100 border border-red-400 text-red-700 rounded-lg">
                    <span th:text="${error}"></span>
                </div>

                <div
                    class="bg-white dark:bg-primary/5 rounded-xl border border-slate-200 dark:border-primary/10 overflow-hidden">
                    <div class="p-6 border-b border-slate-200 dark:border-primary/10">
                        <h2 class="text-2xl font-bold">Edit Profile</h2>
                        <p class="text-slate-500 dark:text-slate-400 text-sm mt-1">Update your password and profile
                            picture.</p>
                    </div>

                    <form th:action="@{/profile/edit}" method="post" enctype="multipart/form-data"
                        class="p-6 space-y-8">

                        <!-- Profile Picture Section -->
                        <div class="flex flex-col sm:flex-row gap-6 items-start sm:items-center">
                            <div
                                class="size-24 rounded-full bg-primary/30 flex items-center justify-center border-4 border-primary overflow-hidden shadow-lg shadow-primary/20 shrink-0">
                                <img th:if="${player.avatarUrl != null}"
                                    th:src="@{${player.avatarUrl}(v=${#dates.createNow().time})}" alt="Current Avatar"
                                    class="h-full w-full object-cover" id="profileImagePreview">
                                <span th:unless="${player.avatarUrl != null}"
                                    class="material-symbols-outlined text-primary text-4xl"
                                    id="profileImagePlaceholder">person</span>
                                <img th:unless="${player.avatarUrl != null}" src="" id="profileImagePreview"
                                    alt="Current Avatar" class="h-full w-full object-cover hidden">
                            </div>
                            <div class="flex-1">
                                <label for="profilePicture" class="block text-sm font-bold mb-2">Profile Picture</label>
                                <input type="file" id="profilePicture" name="profilePicture"
                                    accept="image/png, image/jpeg, image/gif, image/webp" class="block w-full text-sm text-slate-500 dark:text-slate-400
                                    file:mr-4 file:py-2 file:px-4
                                    file:rounded-full file:border-0
                                    file:text-sm file:font-semibold
                                    file:bg-primary/10 file:text-primary
                                    hover:file:bg-primary/20
                                    transition-all cursor-pointer" />
                                <p class="text-xs text-slate-500 dark:text-slate-400 mt-2">JPEG, PNG, WEBP or GIF.</p>
                            </div>
                        </div>

                        <hr class="border-slate-200 dark:border-primary/10">

                        <!-- Password Section -->
                        <div>
                            <h3 class="text-lg font-bold mb-4">Change Password</h3>
                            <div class="space-y-4">
                                <!-- Current Password -->
                                <div>
                                    <label for="oldPassword" class="block text-sm font-bold mb-1">Current
                                        Password</label>
                                    <div class="group relative">
                                        <div
                                            class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                            <span
                                                class="material-symbols-outlined text-slate-400 group-focus-within:text-primary transition-colors text-sm">lock_open</span>
                                        </div>
                                        <input type="password" id="oldPassword" name="oldPassword"
                                            placeholder="Current Password"
                                            class="w-full bg-slate-100 dark:bg-background-dark border border-slate-200 dark:border-primary/20 rounded-lg pl-10 pr-10 py-2 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all font-mono">
                                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center">
                                            <button
                                                class="material-symbols-outlined text-slate-400 hover:text-primary transition-colors text-sm"
                                                type="button" title="Toggle password visibility"
                                                aria-label="Toggle password visibility">visibility</button>
                                        </div>
                                    </div>
                                </div>

                                <!-- New Password -->
                                <div>
                                    <label for="newPassword" class="block text-sm font-bold mb-1">New Password</label>
                                    <div class="group relative">
                                        <div
                                            class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                            <span
                                                class="material-symbols-outlined text-slate-400 group-focus-within:text-primary transition-colors text-sm">lock</span>
                                        </div>
                                        <input type="password" id="newPassword" name="newPassword"
                                            placeholder="New Password"
                                            class="w-full bg-slate-100 dark:bg-background-dark border border-slate-200 dark:border-primary/20 rounded-lg pl-10 pr-10 py-2 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all font-mono">
                                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center">
                                            <button
                                                class="material-symbols-outlined text-slate-400 hover:text-primary transition-colors text-sm"
                                                type="button" title="Toggle password visibility"
                                                aria-label="Toggle password visibility">visibility</button>
                                        </div>
                                    </div>
                                </div>

                                <!-- Confirm New Password -->
                                <div>
                                    <label for="confirmPassword" class="block text-sm font-bold mb-1">Confirm New
                                        Password</label>
                                    <div class="group relative">
                                        <div
                                            class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                            <span
                                                class="material-symbols-outlined text-slate-400 group-focus-within:text-primary transition-colors text-sm">lock_reset</span>
                                        </div>
                                        <input type="password" id="confirmPassword" name="confirmPassword"
                                            placeholder="Confirm New Password"
                                            class="w-full bg-slate-100 dark:bg-background-dark border border-slate-200 dark:border-primary/20 rounded-lg pl-10 pr-10 py-2 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all font-mono">
                                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center">
                                            <button
                                                class="material-symbols-outlined text-slate-400 hover:text-primary transition-colors text-sm"
                                                type="button" title="Toggle password visibility"
                                                aria-label="Toggle password visibility">visibility</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <p class="text-xs text-slate-500 dark:text-slate-400 mt-3">Leave password fields blank if
                                you only want to update your profile picture.</p>
                        </div>

                        <div class="flex justify-end pt-4  space-x-2">
                            <button type="submit"
                                class="flex items-center gap-2 bg-primary text-background-dark px-6 py-2 rounded-lg font-bold hover:brightness-110 transition-all">
                                <span class="material-symbols-outlined">save</span>
                                <span>Save Changes</span>
                            </button>
                            <a th:href="@{/profile/delete}"
                                class="flex items-center gap-2 bg-primary text-background-dark px-6 py-2 rounded-lg font-bold hover:bg-red-500 transition-all">
                                <span class="material-symbols-outlined">delete</span>
                                <span>Delete Account</span>
                            </a>
                        </div>
                    </form>
                </div>
                <!-- Crop Modal -->
                <div id="cropModal"
                    class="fixed inset-0 z-[100] hidden bg-black/80 flex items-center justify-center p-4">
                    <div
                        class="bg-white dark:bg-background-dark rounded-xl max-w-lg w-full overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
                        <div
                            class="p-4 border-b border-slate-200 dark:border-primary/10 flex justify-between items-center">
                            <h3 class="text-lg font-bold">Crop Profile Picture</h3>
                            <button type="button" id="closeCropModal"
                                class="text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 material-symbols-outlined">close</button>
                        </div>
                        <div class="p-4 flex-1 min-h-0 bg-slate-900 border-b border-slate-200 dark:border-primary/10">
                            <!-- Image container needs specific height/width or flex to work well with Cropper.js -->
                            <div class="h-[400px] w-full relative">
                                <img id="cropImage" class="block max-w-full h-auto" src="" alt="To crop">
                            </div>
                        </div>
                        <div class="p-4 flex justify-end gap-3">
                            <button type="button" id="cancelCrop"
                                class="px-4 py-2 rounded-lg font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-primary/10 transition-colors">Cancel</button>
                            <button type="button" id="applyCrop"
                                class="px-4 py-2 rounded-lg font-bold bg-primary text-background-dark hover:brightness-110 transition-colors">Apply
                                Crop</button>
                        </div>
                    </div>
                </div>


            </main>

            <!-- Footer -->
            <footer th:replace="~{fragments/layout :: footer}"></footer>
        </div>
    </div>
</body>

</html>
